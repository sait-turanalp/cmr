# Standalone deployment — Dokploy/Traefik bagimsiz.
# install.sh ile birlikte calistirilir, Caddy kendi TLS'ini yonetir.

services:
  caddy:
    image: caddy:2-alpine
    container_name: cmr-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CMR_DOMAIN=${CMR_DOMAIN}
      - CMR_EMAIL=${CMR_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - cmr-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=${PUBLIC_URL}
        - NEXT_PUBLIC_API_KEY=${API_KEY}
    container_name: cmr-frontend
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:5001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - API_KEY=${API_KEY}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cmr-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cmr-backend
    restart: always
    expose:
      - "5001"
    environment:
      - CORS_DOMAIN=${CORS_DOMAIN}
      - API_KEY=${API_KEY}
      - REDIS_URL=${REDIS_URL}
      - JOBS_BACKEND=${JOBS_BACKEND}
      - PDF_MAX_AGE_HOURS=${PDF_MAX_AGE_HOURS}
      - PARALLEL_WORKERS=${PARALLEL_WORKERS}
      - PARALLEL_MIN_ROWS=${PARALLEL_MIN_ROWS}
      - MAX_ROWS_PER_REQUEST=${MAX_ROWS_PER_REQUEST}
    volumes:
      - backend_outputs:/app/outputs
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cmr-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cmr-redis
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks:
      - cmr-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  autoheal:
    image: willfarrell/autoheal
    container_name: cmr-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  cmr-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  backend_outputs:
  backend_logs:
